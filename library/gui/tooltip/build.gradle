plugins {
	id("qsl.module")
}

qslModule {
	name = "Quilt Tooltip API"
	moduleName = "tooltip"
	id = "quilt_tooltip"
	description = "Hooks and APIs for manipulating tooltips."
	moduleDependencies {
		core {
			api("qsl_base")
			testmodOnly("resource_loader")
		}
		gui {
			// FIXME this shouldn't be necessary since resource_loader already depends on it,
			//  but it's not actually present for the testmod for some reason
			testmodOnly("screen")
		}
	}
	entrypoints {
		client_init {
			values = ["org.quiltmc.qsl.tooltip.impl.client.QuiltClientTooltipMod::INSTANCE"]
		}
		client_events {
			values = ["org.quiltmc.qsl.tooltip.impl.client.QuiltClientTooltipMod::INSTANCE"]
		}
	}
}

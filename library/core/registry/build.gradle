plugins {
	id("qsl.module")
}

qslModule {
	name = "Quilt Registry API"
	moduleName = "registry"
	id = "quilt_registry"
	description = "Tools and events for manipulating and monitoring Minecraft's content registries."
	moduleDependencies {
		core {
			api("qsl_base")
			api("networking")
			api("lifecycle_events")
			testmodOnly("resource_loader")
			testmodOnly("testing")
		}
		data {
			testmodOnly("tags")
		}
		gui {
			testmodOnly("screen") // for resource loader
		}
	}
	entrypoints {
		client_init {
			values = ["org.quiltmc.qsl.registry.impl.sync.client.RegistrySyncClientInitializer"]
		}
		init {
			values = ["org.quiltmc.qsl.registry.impl.sync.RegistrySyncInitializer"]
		}
	}
	accessWidener()
}

sourceSets {
	testmodSyncSkipped {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}

	testmodSyncRequired {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}
}

loom {
	runs {
		testmodSyncSkippedClient {
			client()
			configName = "Testmod Client - Sync Skipped"
			source(project.sourceSets.testmodSyncSkipped)
			runDir("run/sync_skipped/client")
		}

		testmodSyncSkippedServer {
			server()
			configName = "Testmod Server - Sync Skipped"
			source(project.sourceSets.testmodSyncSkipped)
			programArg("--nogui")
			runDir("run/sync_skipped/server")
		}

		testmodSyncRequiredClient {
			client()
			configName = "Testmod Client - Sync Required"
			source(project.sourceSets.testmodSyncRequired)
			runDir("run/sync_required/client")
		}

		testmodSyncRequiredServer {
			server()
			configName = "Testmod Server - Sync Required"
			source(project.sourceSets.testmodSyncRequired)
			programArg("--nogui")
			runDir("run/sync_required/server")
		}
	}

	createRemapConfigurations(sourceSets.testmodSyncSkipped)
	createRemapConfigurations(sourceSets.testmodSyncRequired)
}

dependencies {
	testmodSyncSkippedImplementation sourceSets.main.output
	testmodSyncRequiredImplementation sourceSets.main.output
}
